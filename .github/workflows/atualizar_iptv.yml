name: Atualizar Lista IPTV Global

on:
  schedule:
    # Roda automaticamente todo dia às 03:00 da manhã (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão no GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests

      - name: Executar script de varredura e atualização
        run: |
          python atualizar_lista.py

      - name: Configurar Git para commit automático
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add canais_globais_funcionando.m3u
          git commit -m "feat: atualização automática da lista IPTV [skip ci]" || echo "Nenhuma alteração para commitar"
          git push
